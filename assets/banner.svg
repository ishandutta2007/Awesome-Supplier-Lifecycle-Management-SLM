<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#181135"/>
    </linearGradient>

    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 120; opacity: 0.4; }
        50% { stroke-dashoffset: 0; opacity: 0.9; }
        100% { stroke-dashoffset: -120; opacity: 0.4; }
      }
      @keyframes floatRing {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.6; }
        50% { transform: translateY(-4px) scale(1.05); opacity: 0.9; }
      }
      @keyframes ambientLight {
        0%, 100% { opacity: 0.35; transform: scale(1) translate(0px, 0px); }
        50% { opacity: 0.65; transform: scale(1.1) translate(20px, -10px); }
      }
      @keyframes badgePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
      .anim-beam {
        stroke-dasharray: 14 10;
        animation: pulseBeam 4s linear infinite;
      }
      .anim-glow-1 {
        animation: ambientLight 8s ease-in-out infinite;
        transform-origin: 300px 150px;
      }
      .anim-glow-2 {
        animation: ambientLight 10s ease-in-out infinite reverse;
        transform-origin: 900px 250px;
      }
      .anim-node {
        animation: floatRing 3s ease-in-out infinite;
      }
      .node-d1 { animation-delay: 0.0s; }
      .node-d2 { animation-delay: 0.6s; }
      .node-d3 { animation-delay: 1.2s; }
      .node-d4 { animation-delay: 1.8s; }
      .node-d5 { animation-delay: 2.4s; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGradient)"/>

  <!-- Ambient Dynamic Glow Lights (Behind all text & foreground content) -->
  <g>
    <circle class="anim-glow-1" cx="240" cy="120" r="180" fill="url(#accentGlow)" filter="url(#softGlow)"/>
    <circle class="anim-glow-2" cx="960" cy="280" r="220" fill="url(#accentGlow)" filter="url(#softGlow)"/>
    <ellipse cx="600" cy="380" rx="450" ry="80" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)"/>
  </g>

  <!-- Subtle High-Tech Blueprint Grid Pattern (Subtle Background) -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="0.8">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="250" y1="0" x2="250" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="550" y1="0" x2="550" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="850" y1="0" x2="850" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
  </g>

  <!-- Outer Border Frame -->
  <rect x="12" y="12" width="1176" height="396" rx="16" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.8"/>
  <rect x="18" y="18" width="1164" height="390" rx="12" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>

  <!-- Top Decorative Category Tag -->
  <g transform="translate(600, 52)">
    <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
    <circle cx="-140" cy="0" r="4" fill="#38bdf8"/>
    <text x="5" y="4.5" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE PROCUREMENT &amp; SRM</text>
  </g>

  <!-- MAIN FOREGROUND TITLE (Crisp, High Contrast, Guaranteed Foreground) -->
  <g transform="translate(600, 115)">
    <text text-anchor="middle" fill="url(#primaryGradient)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="1">
      AWESOME SUPPLIER LIFECYCLE MANAGEMENT
    </text>
    <text y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="600" letter-spacing="0.4">
      The Curated Directory of SaaS Platforms &amp; Open-Source SRM Solutions
    </text>
    <text y="68" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="400">
      Supplier Discovery • Automated Onboarding • TPRM &amp; ESG Risk • Performance Scorecards • e-Procurement
    </text>
  </g>

  <!-- DYNAMIC INTERACTIVE LIFECYCLE PIPELINE (Flow representation) -->
  <g transform="translate(0, 235)">
    <!-- Base Pipeline Track -->
    <path d="M 160 30 L 1040 30" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <!-- Animated Light Pulse Beam traveling along the supplier lifecycle path -->
    <path class="anim-beam" d="M 160 30 L 1040 30" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Step 1: Discovery & Qualification -->
    <g class="anim-node node-d1" transform="translate(190, 30)">
      <circle r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#nodeGlow)"/>
      <circle r="16" fill="#0284c7" opacity="0.2"/>
      <text y="5" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">01</text>
      <rect x="-60" y="32" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text y="48" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">1. Discovery</text>
    </g>

    <!-- Step 2: Onboarding & KYC -->
    <g class="anim-node node-d2" transform="translate(395, 30)">
      <circle r="22" fill="#0f172a" stroke="#818cf8" stroke-width="2" filter="url(#nodeGlow)"/>
      <circle r="16" fill="#6366f1" opacity="0.2"/>
      <text y="5" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">02</text>
      <rect x="-60" y="32" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text y="48" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">2. Onboarding</text>
    </g>

    <!-- Step 3: TPRM & Compliance -->
    <g class="anim-node node-d3" transform="translate(600, 30)">
      <circle r="22" fill="#0f172a" stroke="#c084fc" stroke-width="2" filter="url(#nodeGlow)"/>
      <circle r="16" fill="#a855f7" opacity="0.2"/>
      <text y="5" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">03</text>
      <rect x="-65" y="32" width="130" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text y="48" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">3. Risk &amp; Audit</text>
    </g>

    <!-- Step 4: Performance & KPIs -->
    <g class="anim-node node-d4" transform="translate(805, 30)">
      <circle r="22" fill="#0f172a" stroke="#34d399" stroke-width="2" filter="url(#nodeGlow)"/>
      <circle r="16" fill="#10b981" opacity="0.2"/>
      <text y="5" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">04</text>
      <rect x="-65" y="32" width="130" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text y="48" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">4. Scorecards</text>
    </g>

    <!-- Step 5: Contracting & Renewal -->
    <g class="anim-node node-d5" transform="translate(1010, 30)">
      <circle r="22" fill="#0f172a" stroke="#fbbf24" stroke-width="2" filter="url(#nodeGlow)"/>
      <circle r="16" fill="#f59e0b" opacity="0.2"/>
      <text y="5" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">05</text>
      <rect x="-60" y="32" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text y="48" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">5. Governance</text>
    </g>
  </g>

  <!-- FOREGROUND FEATURE PILLS / HIGHLIGHT BADGES -->
  <g transform="translate(600, 360)">
    <!-- Pill 1: Market Scale -->
    <g transform="translate(-390, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
      <text y="5" text-anchor="middle" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📊 $25B+ SRM Market</text>
    </g>

    <!-- Pill 2: Open Source -->
    <g transform="translate(-130, 0)">
      <rect x="-90" y="-15" width="180" height="30" rx="15" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
      <text y="5" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="600">💻 Self-Hosted &amp; Open Source</text>
    </g>

    <!-- Pill 3: Enterprise Ready -->
    <g transform="translate(130, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <text y="5" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🏢 Fortune 500 SaaS</text>
    </g>

    <!-- Pill 4: AI Driven -->
    <g transform="translate(380, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text y="5" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🤖 AI Risk &amp; Sourcing</text>
    </g>
  </g>
</svg>
